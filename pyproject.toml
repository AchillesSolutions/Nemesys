[project]
name = "kickoff"
version = "0.1.0"
description = "Nemesys: an AI rival fan to watch football with, by voice. One GPT-Live voice, steered by a team of agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "agent-framework-core>=1.20,<2",
    "agent-framework-openai>=1.15,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kickoff = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
